```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #07152f;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            top: -170px;
            left: -120px;
            background: #22d3ee;
            filter: blur(20px);
            opacity: 0.75;
            animation: floatOne 10s ease-in-out infinite alternate;
        }

        body::after {
            width: 460px;
            height: 460px;
            right: -150px;
            bottom: -190px;
            background: #7c3aed;
            filter: blur(25px);
            opacity: 0.75;
            animation: floatTwo 12s ease-in-out infinite alternate;
        }

        .glow {
            position: absolute;
            width: 260px;
            height: 260px;
            left: 50%;
            bottom: -160px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: #ec4899;
            filter: blur(45px);
            opacity: 0.35;
            pointer-events: none;
            animation: floatThree 8s ease-in-out infinite alternate;
        }

        .login-container {
            width: 90%;
            max-width: 430px;
            position: relative;
            z-index: 1;
            padding: 42px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: cardFloat 5s ease-in-out infinite;
        }

        .login-container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.22),
                rgba(255, 255, 255, 0.04)
            );
            pointer-events: none;
            z-index: -1;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: 42px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            animation: logoPulse 3s ease-in-out infinite;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 9px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: white;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.24);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.34);
            transform: translateY(-2px);
        }

        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            animation: buttonShine 3.5s ease-in-out infinite;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.62);
            font-size: 12px;
        }

        @keyframes floatOne {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(90px, 55px) scale(1.12); }
        }

        @keyframes floatTwo {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, -60px) scale(1.1); }
        }

        @keyframes floatThree {
            0% { transform: translateX(-50%) translateY(0) scale(1); }
            100% { transform: translateX(-50%) translateY(-45px) scale(1.15); }
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes buttonShine {
            0%, 55% { left: -120%; }
            75%, 100% { left: 140%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="login-container">

        <div class="logo">🎓</div>

        <h1>CGPA Calculator</h1>

        <p class="subtitle">
            Calculate and track your academic performance
        </p>

        <form method="POST" action="/login">

            <div class="form-group">
                <label for="student_name">Student Name</label>

                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="reg_no">Register Number</label>

                <input
                    type="text"
                    id="reg_no"
                    name="reg_no"
                    placeholder="Enter your register number"
                    required
                >
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            GPA &amp; CGPA Calculator
        </div>

    </div>

</body>
</html>
```
